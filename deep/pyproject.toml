[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radassistant-deep"
version = "0.1.0"
description = "RadAssistant workflow re-implemented as a LangChain deep agent: a single orchestrator that plans, uses Slicer tools, and spawns subagents on demand."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.6",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
ollama = ["langchain-ollama"]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
all = ["langchain-ollama", "langchain-openai", "langchain-anthropic"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["radassistant_deep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
